[package]
name = "telegram"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
async-trait = { workspace = true }
chrono = { workspace = true }
futures = { workspace = true }
futures-timer = { workspace = true }
grammers-client = { version = "0.10.0", default-features = false }
grammers-session = { version = "0.10.0", default-features = false, features = ["sqlite-storage"] }
# libsql-ffi 0.9.30 was published with an empty default bindgen.rs. Enabling
# its session feature selects the populated bindings shipped in the same crate.
libsql-ffi-workaround = { package = "libsql-ffi", version = "0.9.30", features = ["session"] }
messenger_interface = { workspace = true }
secure-string = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time"] }
tracing = { workspace = true }
