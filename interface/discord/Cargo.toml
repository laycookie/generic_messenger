[package]
name = "discord"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
# Logs
tracing = { workspace = true }
# Async
async-lock = { workspace = true }
asyncs-sync = { workspace = true }
async-trait = { workspace = true }
async-tungstenite = { version = "0.34.0", features = ["smol-runtime", "smol-native-tls"] }
# Futures
futures = { workspace = true }
futures-timer = { workspace = true }
# Data structs
arc-swap = "1.9.1"
dashmap = { workspace = true }
uuid = { workspace = true }
# Time
chrono = { workspace = true }
# Fetch
surf = { workspace = true }
percent-encoding = { workspace = true }
base64 = { workspace = true }
# Serialize/Deserialize
facet = { workspace = true }
facet-value = { workspace = true }
facet-json = { workspace = true }
facet-pretty = { workspace = true }
# Networking
smol = { workspace = true }
pnet_macros = "0.35.0"
pnet_macros_support = "0.35.0"
# Audio
simple-audio-channels = { workspace = true }
opus = { workspace = true }
# Video
simple-video = { workspace = true, features = ["h264", "av1"] }
# Security
secure-string = { workspace = true }
libsodium-rs = "0.2.4"
rsa = { version = "0.9.10", features = ["sha2"] }
# 0.1.4 is the minimum viable version for *video*: 0.1.3's frame
# reconstruction dropped the ciphertext of any frame whose unencrypted
# prefix was at least as large as its encrypted body (tiny P-frames), so
# receivers failed DAVE authentication on nearly every inter frame.
davey = "0.1.4"
# Interface
messenger_interface = { workspace = true }
messenger_downloader = { workspace = true }
# enums
num_enum = "0.7.6"
# Bitflags
bitflags = { workspace = true }
credential_macro = { workspace = true }

[dev-dependencies]
openmls = "0.8.1"
openmls_basic_credential = "0.5.0"
openmls_rust_crypto = "0.5.1"
