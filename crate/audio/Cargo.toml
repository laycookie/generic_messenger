[package]
name = "simple-audio-channels"
version = "0.0.1"
edition = "2024"
description = "Simple audio mixer"
license = "GPL-2.0-only"
repository = "https://github.com/laycookie/generic_messenger"

[features]
default = []
bench-internals = []

[dependencies]
tracing = { workspace = true }
asyncs-sync = { workspace = true }
simple-audio-channels-macro = { path = "macro", version = "0.0.1" }
ringbuf = "0.4.8"
crossbeam-queue = "0.3.13"
# async-broadcast = "0.7.2"
cpal = "0.17.3"
fundsp = { version = "0.23.0", default-features = false, features = ["std"] }

[dev-dependencies]
criterion = { workspace = true }

[[bench]]
name = "effects"
harness = false

[[bench]]
name = "simd_kernels"
harness = false
required-features = ["bench-internals"]
