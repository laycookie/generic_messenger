[package]
name = "messenger_interface"
version = "0.0.1"
edition = "2024"
description = "Interface for messaging system"
readme = "README.md"
license = "GPL-2.0-only"
repository = "https://github.com/laycookie/generic_messenger"

[dependencies]
simple-audio-channels = { workspace = true }
simple-video = { workspace = true }
messenger_stream = { path = "../messenger_stream", version = "0.0.1" }
tracing = { workspace = true }
async-trait = { workspace = true }
futures = { workspace = true }
facet = { workspace = true }
facet-error = { workspace = true }
bitflags = { workspace = true }
chrono = { workspace = true }
secure-string = { workspace = true }
credential_macro = { workspace = true }
tempfile = { workspace = true }

[target.'cfg(unix)'.dependencies]
rustix = { workspace = true, features = ["fs"] }
